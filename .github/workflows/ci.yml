name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev,report]"
      - run: python -m btc_nq_coherence.protocol configs/research_protocol.yaml
      - run: ruff check .
      - run: mypy
      - run: pytest
      - run: python report/build_report.py --check
