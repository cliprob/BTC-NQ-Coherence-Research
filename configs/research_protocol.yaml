schema_version: 1
protocol_version: 0.2.0
status: draft
created_at: 2026-09-17

research:
  primary_question: >-
    Do synchronized, volatility-adjusted BTC and NQ moves form persistent
    coherence regimes, and how do joint move intensity and cross-market
    magnitude balance relate to regime duration and returns realized while
    the regime remains active?
  hypotheses:
    - id: H1
      name: regime_persistence
      role: primary_candidate
    - id: H2
      name: magnitude_conditioned_persistence
      role: primary_candidate
    - id: H3
      name: coherence_decay
      role: secondary
    - id: H4
      name: post_etp_regime_change
      role: secondary_associational
  exploratory_outcomes:
    - weaker_market_catch_up
    - joint_continuation
    - reversal
    - no_economically_relevant_balance_effect

design:
  price_domain: returns_not_levels
  proposed_primary_bar_minutes: 5
  primary_horizon_minutes: null
  candidate_horizons_minutes: [1, 5, 10, 15, 30, 60]
  primary_session: proposed_us_cash_hours
  earliest_execution: next_bar_open
  prediction_comparison: nq_only_vs_nq_plus_btc
  strategy_stage_locked: true
  coherence_excludes_magnitude: true
  feature_roles:
    coherence: direction_and_normalized_candle_shape
    joint_intensity: common_move_strength
    magnitude_balance: cross_market_relative_strength
    catch_up: exploratory_not_assumed

data:
  development_data_previously_inspected: true
  exploratory_data_end: 2026-05-12
  desired_pre_etp_start: 2022-01-01
  final_holdout_start: null
  final_holdout_end: null
  raw_data_committed: false

governance:
  protocol_frozen: false
  final_holdout_opened: false
  append_only_trial_ledger_required: true
  raw_input_hashes_required: true
  deviation_log_required_after_freeze: true
