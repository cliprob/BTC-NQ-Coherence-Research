schema_version: 1
protocol_version: 1.0.0
status: completed_development
created_at: 2026-09-17

research:
  primary_question: >-
    Do synchronized, volatility-adjusted BTC and NQ moves form persistent
    coherence regimes, and how do joint move intensity and cross-market
    magnitude balance relate to regime duration and returns realized while
    the regime remains active?
  hypotheses:
    - id: H1
      name: regime_persistence
      role: development_context
    - id: H2
      name: magnitude_conditioned_persistence
      role: development_primary_state_comparison
    - id: H3
      name: coherence_decay
      role: not_pursued_strategy_stage
    - id: H4
      name: post_etp_regime_change
      role: deferred_unavailable_in_current_data
  exploratory_outcomes:
    - weaker_market_catch_up
    - joint_continuation
    - reversal
    - no_economically_relevant_balance_effect

design:
  price_domain: returns_not_levels
  primary_bar_minutes: 5
  robustness_bar_minutes: [1]
  run_robustness_regardless_of_primary_result: true
  primary_horizon_minutes: 5
  candidate_horizons_minutes: [5, 15, 30, 60]
  economic_return:
    price_basis: next_open_to_horizon_open
    primary_horizon_minutes: 5
    primary_five_minute_bars: 1
    robustness_one_minute_bars: 5
    one_minute_timing_diagnostics_minutes: [1, 2, 3, 4, 5]
    secondary_response_horizons_minutes: [15, 30, 60]
    intermediate_diagnostics_secondary_only: true
    secondary_may_replace_primary: false
    target_must_remain_in_primary_session: true
  session_scope:
    timezone: America/New_York
    interval_semantics: left_closed_right_open
    primary:
      role: development_primary
      calendar: XNYS
      nominal_open: "09:30"
      nominal_close: "16:00"
      early_close_policy: official_calendar_close
      signal_after_bar_close: true
      target_must_end_by_official_close: true
      exit_must_end_by_official_close: true
      truncate_target_or_position_at_close: false
      carry_position_overnight: false
      causal_lookback_may_precede_open: true
      pre_open_bars_may_be_signals_or_outcomes: false
    overnight_negative_control:
      enabled: true
      required_regardless_of_primary_result: true
      role: negative_control
      calendar: CME_equity_futures
      start_previous_evening: "18:00"
      end: "09:30"
      excludes_maintenance_break: true
      excludes_weekends_and_holidays: true
      separately_reported: true
      may_select_or_replace_primary_parameters: false
      post_cash_pre_maintenance_included: false
  earliest_execution: next_bar_open
  prediction_comparison: nq_only_vs_nq_plus_btc
  strategy_stage_locked: true
  coherence_excludes_magnitude: true
  primary_candle_component: log_close_over_open_body
  primary_uses_wicks_or_range: false
  feature_roles:
    coherence: recent_candle_body_direction_agreement
    joint_intensity: common_normalized_body_strength
    magnitude_balance: cross_market_relative_body_strength
    catch_up: exploratory_not_assumed
  magnitude_coordinates:
    normalized_body_magnitude: absolute_standardized_body
    historical_scale:
      estimator: same_session_slot_mad
      mad_consistency_constant: 1.4826
      lookback_eligible_sessions: 63
      reference_sessions: analysis_calendar_eligible_sessions
      slot_timezone: America/New_York
      separate_by_asset: true
      separate_by_resolution: true
      include_current_session: false
      current_body_centering: none
      missing_slot_policy: extend_back_until_63_valid
      minimum_valid_observations: 63
      zero_or_nonfinite_scale_policy: ineligible
      epsilon_floor: null
      cross_slot_fallback: false
      future_data_fallback: false
      roll_or_known_gap_policy: ineligible
      online_update_from_completed_prior_sessions: true
    joint_intensity: geometric_mean
    magnitude_balance: normalized_difference
    magnitude_balance_range: [-1, 1]
    zero_denominator_policy: ineligible
    common_direction: shared_body_sign
    coefficient_sign_constraints: none
  coherence_measure:
    per_bar_agreement: signed_body_direction_product
    exact_doji_value: 0
    missing_or_invalid_policy: ineligible_window
    aggregation: unweighted_arithmetic_mean
    scales_minutes: [15, 30, 60]
    use_scales_jointly: true
    output_range: [-1, 1]
  state_model_comparison:
    eligibility: current_bar_body_direction_agreement
    target: next_bar_body_direction_agreement_given_current_agreement
    estimator: discrete_time_logistic
    m0_predictors: [coherence_15m, coherence_30m, coherence_60m, common_direction]
    m1_additional_predictors:
      - joint_intensity
      - magnitude_balance
      - absolute_magnitude_balance
    evaluation: [brier_score, log_loss, calibration]
    pnl_selection_prohibited: true
    coherence_threshold: null
    threshold_stage: strategy_only
  bar_construction:
    source_bar_minutes: 1
    primary_derived_from_source: true
    alignment_timezone: UTC
    open: first
    high: maximum
    low: minimum
    close: last
    volume: sum
    incomplete_bin_policy: ineligible
    forward_fill_prices: false
    may_cross_session_roll_or_known_gap: false
    coherence_scales_are_clock_time: true

data:
  development_data_previously_inspected: true
  exploratory_data_end: 2026-05-12
  desired_pre_etp_start: 2022-01-01
  final_holdout_start: null
  final_holdout_end: null
  raw_data_committed: false
  minimum_pre_sample_warmup_sessions: 63
  current_iteration:
    mode: development_only
    complete_primary_sessions_before_warmup: 458
    complete_overnight_sessions_before_warmup: 551
    exclude_incomplete_session_entirely: true
    exclude_contract_transition_session: true
    forward_fill_prices: false
    pre_etp_sample_available: false
    pristine_final_holdout_available: false
    confirmatory_claims_permitted: false
    weekday_sampling_imbalance_present: true

governance:
  protocol_frozen: true
  freeze_scope: completed_development_record
  frozen_at: 2026-09-17
  preregistered: false
  frozen_after_results: true
  final_holdout_opened: false
  future_confirmatory_protocol_required: true
  strategy_stage_disposition: not_pursued_registered_return_evidence_absent
  append_only_trial_ledger_required: true
  raw_input_hashes_required: true
  deviation_log_required_after_freeze: true
  multiplicity:
    claim_scope: development_only
    primary_resolution_minutes: 5
    primary_state_comparison: m1_vs_m0_brier_score
    primary_return_comparison: cross_market_vs_nq_only_mse
    familywise_confirmatory_error_control: not_claimed
    confidence_intervals: unadjusted_95_percent_session_block_bootstrap
    secondary_results: descriptive_or_robustness_only
    secondary_may_rescue_primary: false
    all_trials_reported: true
    future_confirmatory_procedure: new_protocol_required
