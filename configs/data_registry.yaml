rejected_candidates:
  nasdaq_generic_2024_2025:
    file_name: Nasdaq_1_minute_data_2024-01-01_to_2025-12-05.csv
    reason:
      - instrument and vendor are not documented
      - no futures contract identifier is present
      - prices are not constrained to the NQ minimum tick
      - unsuitable for roll-aware confirmatory futures research

holdout:
  available_in_registered_files: false
  rule: >-
    No timestamp at or before 2026-05-12 may be called a pristine final holdout,
    because the range was already available during earlier project iterations.
  proposed_start_exclusive: 2026-05-12
  boundaries_frozen: false
