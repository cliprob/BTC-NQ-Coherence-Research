schema_version: 1
control_version: 0.1.0
status: development_only_negative_control
role: overnight_negative_control

session:
  calendar: CME_Equity
  timezone: America/New_York
  start_previous_evening: "18:00"
  end: "09:30"
  expected_minutes: 930
  may_replace_primary: false

walk_forward:
  session_order: chronological
  expected_feature_ready_sessions: 488
  initial_training_sessions: 135
  validation_sessions: 22
  step_sessions: 22
  purge_sessions: 1
  expected_outer_folds: 16
  inner_validation_folds: 3
  inner_validation_sessions: 22
  inner_purge_sessions: 1
  partial_final_fold: reject

state_model:
  source_config: configs/state_models.yaml
  predictors_and_regularization: identical
  primary_metric: brier_score

return_model:
  source_config: configs/return_models.yaml
  predictors_target_and_regularization: identical
  primary_metric: mean_squared_error
  within_session_history_minutes: 60

descriptive:
  primary_horizon_minutes: 5
  secondary_horizons_minutes: [15, 30, 60]

uncertainty:
  method: paired_analysis_session_block_bootstrap
  confidence_level: 0.95
  replications: 5000
  seed: 20260917

interpretation:
  expected_role: falsification_of_cash_session_specificity
  state_specificity_rule: >-
    cash-session specificity requires primary state evidence and no overnight
    state evidence under the registered rules
  return_specificity_rule: >-
    cash-session return specificity requires primary return evidence and no
    overnight return evidence under the registered rules
  favorable_result_may_replace_primary: false
  unfavorable_result_may_be_omitted: false
