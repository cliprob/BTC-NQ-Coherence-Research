[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "btc-nq-coherence-research"
version = "0.1.0"
description = "Protocol-first research on conditional BTC–NQ co-movement and magnitude asymmetry"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
  "types-PyYAML>=6.0.12,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
btc_nq_coherence = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["btc_nq_coherence"]
